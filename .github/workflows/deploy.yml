name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 赋予 GITHUB_TOKEN 发布 Pages 所需权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免互相覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          # 网页部署不需要 Electron 运行时，跳过其 ~150MB 的 Chromium 下载以加速
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build
        run: |
          rm -rf build-out
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
